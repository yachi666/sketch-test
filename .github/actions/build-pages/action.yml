name: Build Pages frontend
description: Build workspace dependencies and the Web frontend for a project Pages URL
inputs:
  control-plane-url:
    description: Public HTTPS Control Plane origin, if configured
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Build workspace dependencies
      shell: bash
      run: pnpm turbo run build --filter='web^...' --force
    - name: Build Web at its Pages base path
      shell: bash
      env:
        PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        VITE_CP_BASE: ${{ inputs.control-plane-url }}
      run: |
        pnpm --filter web exec vite build --base "$PAGES_BASE_PATH"
        cp apps/web/dist/index.html apps/web/dist/404.html
        touch apps/web/dist/.nojekyll
