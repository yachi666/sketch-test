pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm biome format --write {staged_files}
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,css}"
      stage_fixed: true
    lint:
      run: pnpm biome check {staged_files}
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,css}"
    typecheck:
      run: pnpm turbo run check --filter='...[HEAD]'
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc}"

commit-msg:
  commands:
    conventional:
      run: npx commitlint --edit "$1"

pre-push:
  commands:
    test:
      run: pnpm turbo run test --filter='...[HEAD]'
